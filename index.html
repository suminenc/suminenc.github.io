<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수민이앤씨 | 구조보강 · 소구경파일</title>
<meta name="description" content="수민이앤씨 — 구조보강(철판, H형강, 탄소섬유)과 소구경파일(마이크로파일, 압입파일) 공사">
<meta property="og:title" content="수민이앤씨">

<meta property="og:image" content="https://suminenc.github.io/assets/symbol.png">
<link rel="icon" type="image/png" href="assets/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* CI v2.3 색 */
  :root { --navy: #102B4A; --steel: #35628D; --light: #759FCC; --ink: #172B40; --soft: #F5F8FB; --line: #DFE6EE; --muted: #5E6E80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans KR", sans-serif; color: var(--ink); background: #fff; line-height: 1.6; word-break: keep-all; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 20px 40px; }
  .logo { display: flex; align-items: center; gap: 18px; }
  .logo img { height: 76px; width: auto; display: block; }
  .ko { font-size: 34px; font-weight: 700; color: var(--navy); line-height: 1; letter-spacing: -.01em; }
  .en { font-size: 10.6px; color: var(--ink); margin-top: 8px; line-height: 1; white-space: nowrap; }
  .lead { margin: 44px 0 28px; font-size: 18px; color: var(--navy); font-weight: 500; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--soft); border-radius: 12px; padding: 20px 22px; }
  .card h2 { font-size: 15px; color: var(--steel); font-weight: 700; margin-bottom: 8px; }
  .card li { list-style: none; font-size: 16px; color: var(--ink); padding-left: 14px; position: relative; }
  .card li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--light); }
  .contact { margin-top: 28px; border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .contact h2 { font-size: 15px; color: var(--steel); font-weight: 700; margin-bottom: 10px; }
  .row { display: flex; gap: 14px; font-size: 15.5px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row b { width: 64px; flex: none; color: var(--muted); font-weight: 500; }
  .row a { color: var(--navy); text-decoration: none; font-weight: 500; }
  .call { display: inline-block; margin-top: 18px; background: var(--navy); color: #fff; text-decoration: none; border-radius: 10px; padding: 13px 22px; font-weight: 700; font-size: 16px; }
  footer { margin-top: 48px; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 520px) {
    .wrap { padding-top: 36px; }
    .logo img { height: 60px; }
    .ko { font-size: 27px; } .en { font-size: 8.4px; margin-top: 6px; }
    .cards { grid-template-columns: 1fr; }
    .row b { width: 52px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="assets/symbol.png" alt="수민이앤씨 심볼">
    <div><div class="ko">수민이앤씨</div><div class="en">SUMIN Engineering &amp; Construction</div></div>
  </div>

  <p class="lead">건축물 구조보강과 소구경파일 공사를 합니다.</p>

  <div class="cards">
    <div class="card"><h2>구조보강</h2><ul><li>철판 보강</li><li>H형강 보강</li><li>탄소섬유 보강</li></ul></div>
    <div class="card"><h2>소구경파일</h2><ul><li>마이크로파일</li><li>압입파일</li></ul></div>
  </div>

  <div class="contact">
    <h2>연락처</h2>
    <div class="row"><b>대표</b><span>이수영</span></div>
    <div class="row"><b>휴대폰</b><a href="tel:010-6342-9357">010-6342-9357</a></div>
    <div class="row"><b>이메일</b><a href="mailto:sylee070317@naver.com">sylee070317@naver.com</a></div>
    <div class="row"><b>주소</b><span>서울 중랑구 신내역로3길 40-36 신내데시앙플렉스 지식산업센터 SB408호</span></div>
  </div>
  <a class="call" href="tel:010-6342-9357">전화 걸기</a>

  <footer>© 2026 수민이앤씨 · 홈페이지 준비 중입니다.</footer>
</div>
<script>
  // 영문 줄 폭을 국문 폭에 맞춘다(CI 규칙)
  document.fonts.ready.then(() => {
    const ko = document.querySelector(".ko"), en = document.querySelector(".en");
    let fs = parseFloat(getComputedStyle(en).fontSize);
    for (let i = 0; i < 6; i++) { fs *= ko.getBoundingClientRect().width / en.getBoundingClientRect().width; en.style.fontSize = fs + "px"; }
  });
</script>
</body>
</html>
